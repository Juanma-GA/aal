# Catálogo de módulos del PALI (E02): grupos y módulos con los textos de la
# especificación de requisitos del cliente. Lo carga
# app/services/module_catalog.py (la migración 0003 y
# scripts/load_module_catalog.py). Al recargar se añaden los módulos nuevos y
# se actualizan los textos, pero nunca se pisan el estado ni la ruta de un
# módulo que ya existe (los cambia un admin en Ajustes -> Módulos).
#
# Cambios sobre el fichero entregado con E02: estados iniciales de E02 §2.1
# (panel "disponible" con su ruta; materiales "en_desarrollo") y la clave
# opcional `ruta` (solo en los disponibles: plantilla de URL, con
# :materialId para las páginas de un material).
