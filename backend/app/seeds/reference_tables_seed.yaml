- codigo: M101
  nombre: Código de acción de mantenimiento (tabla M101 SIGLE)
  fuente: NT 10/17 (mayo 2017) §12.2.4
  atributos_definicion:
  - clave: m101
    nombre: Código M101
    tipo: texto
  - clave: uso
    nombre: Uso
    tipo: texto
  valores:
  - codigo: A
    descripcion: Sustituir
    atributos:
      m101: A00
      uso: Sustitución de componentes no reparables o cambio de líquidos funcionales. Para un componente reparable se usa
        desmontar/montar.
  - codigo: B
    descripcion: Ajustar
    atributos:
      m101: B00
      uso: Ajustes, aprietes de elementos roscados, etc.
  - codigo: C
    descripcion: Reparar
    atributos:
      m101: C00
      uso: Reparación de componentes reparables (NOC del componente) o reparación sobre la plataforma sin desmontar (NOC de
        la plataforma).
  - codigo: D
    descripcion: Calibrar
    atributos:
      m101: D00
      uso: Calibración de útiles, instrumentos de medida, etc.
  - codigo: E
    descripcion: Servicio
    atributos:
      m101: E00
      uso: Limpieza, pintura, reposición de niveles de líquidos funcionales, purgado, etc.
  - codigo: F
    descripcion: Inspección inicial
    atributos:
      m101: F00
      uso: Inspecciones iniciales de calidad.
  - codigo: G
    descripcion: Inspección final
    atributos:
      m101: G00
      uso: Inspecciones finales de calidad.
  - codigo: J
    descripcion: Revisar / comprobar
    atributos:
      m101: J00
      uso: Comprobación, inspección, inspección visual, revisión, verificación, validación, etc.
  - codigo: L
    descripcion: Quitar y reinstalar
    atributos:
      m101: L00
      uso: Desmontar un componente para ejecutar una tarea sobre otro (p. ej. quitar el radiador para acceder al motor).
  - codigo: R
    descripcion: Lubricar
    atributos:
      m101: R00
      uso: Aplicación de grasa o aceite. El cambio de aceite o de filtros es código A.
  - codigo: S
    descripcion: Desinstalar / desmontar
    atributos:
      m101: S00
      uso: Desmontar un componente para realizar una acción de mantenimiento sobre él.
  - codigo: T
    descripcion: Montar / instalar
    atributos:
      m101: T00
      uso: Montar un componente.
  - codigo: X
    descripcion: Actualización de software / firmware
    atributos:
      m101: X00
      uso: Tareas de software o firmware.
- codigo: OPERATIVIDAD
  nombre: Operatividad (7º dígito del código de tarea)
  fuente: NT 10/17 (mayo 2017) §12.2.2
  valores:
  - codigo: '1'
    descripcion: Operativo
  - codigo: '2'
    descripcion: Operativo con limitaciones
  - codigo: '3'
    descripcion: Inoperativo
- codigo: CRITICIDAD
  nombre: Criticidad (8º dígito del código de tarea)
  fuente: NT 10/17 (mayo 2017) §12.2.3
