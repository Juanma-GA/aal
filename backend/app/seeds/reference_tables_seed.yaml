# Tablas de referencia (E03, RNF-07) y definición de los 30 campos del
# artículo (Fichero Carga / MAR06). Adjunto del encargo E03, versionado aquí.
#
# Lo carga app/services/reference_tables.py desde la migración 0004 y con
# scripts/load_reference_tables.py. Una recarga añade tablas y valores nuevos
# pero nunca modifica un valor que ya esté en la base (lo puede haber editado
# un administrador): las diferencias solo se informan.
#
# Cambios respecto al adjunto:
# - `atributos_definicion` en las tablas con atributos (D114, D155,
#   NIVEL_FUNCIONAL, M101, CRITICIDAD): nombre legible, tipo (texto, entero,
#   si_no) y opciones de cada atributo, para mostrarlos (HR21), validarlos y
#   llevarlos a columnas de Excel.
# - El código 09 de D114 va entre comillas: los códigos son siempre texto
#   (la carga rechaza cualquier código que no lo sea).
# - E13: vaUsoArt (campo 56) pasa de longitud 2 a 5 y caVoluArt (campo 46) de
#   6 a 8, como la guía MAR06. Convención de `longitud` en los numéricos: el
#   número de dígitos, sin contar la coma (la precisión de SQL); `decimales`,
#   cuántos de ellos van tras la coma. El "tamaño" de la guía cuenta también
#   la coma cuando hay decimales: peso, largo, ancho y alto 7,2 = tamaño 8;
#   vaUsoArt 5,2 admite 999,99, que cubre el tamaño 5 (99,99) de la guía;
#   imEstdArt 9,2 se queda como estaba (no se reduce ninguna longitud).
