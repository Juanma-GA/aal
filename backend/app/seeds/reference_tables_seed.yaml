  - codigo: T
    descripcion: Máximo Secreto
  - codigo: U
    descripcion: No Clasificado
  - codigo: '7'
    descripcion: El artículo muestra información sensible. Antes de la "baja y liquidación", se deben quitar y destruir todas
      las placas, etiquetas y nombres de las placas, marcas y documentos que relacionen los artículos con el sistema de armas
      o conjunto de aplicación final.
  - codigo: '9'
    descripcion: Identifica un artículo CCI (Controlled Cryptographic Item) o Artículo criptográfico controlado. Son equipos
      de telecomunicaciones seguras o de manejo de información, los componentes criptográficos asociados, u otros artículos
      que realizan funciones críticas de seguridad de las comunicaciones (COMSEC). Estos artículos no están clasificados,
      pero sí controlados y llevan la designación CCI.
  - codigo: '&'
    descripcion: Restringido
  - codigo: '@'
    descripcion: El artículo está clasificado, pero su nivel de clasificación todavía no se ha indicado/determinado.
