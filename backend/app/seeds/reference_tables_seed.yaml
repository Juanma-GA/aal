- codigo: D155
  nombre: Unidades de suministro o envío
  fuente: Campos Ficha (NATO ACodP-1, tabla 31)
  nota: El significado del asterisco que precede a algunos términos en la fuente está por confirmar; se conserva en atributos.marca_asterisco.
  atributos_definicion:
  - clave: marca_asterisco
    nombre: Asterisco en la fuente
    tipo: si_no
  valores:
  - codigo: AA
    descripcion: Doscientos cincuenta
    definicion: Doscientas cincuenta (250) unidades de un artículo de abastecimiento.
    atributos:
      marca_asterisco: false
  - codigo: AM
    descripcion: Ampolla
    definicion: Pequeño tubo de vidrio o plástico sellado por fusión después de llenado.
    atributos:
      marca_asterisco: true
  - codigo: AT
    descripcion: Surtido
    definicion: Un conjunto de artículos variados de una misma categoría o clase, embalados en una unidad y que constituyen
      un único artículo de abastecimiento. Úsese sólo cuando el término "surtido" forma parte del nombre del artículo.
    atributos:
      marca_asterisco: false
  - codigo: AX
    descripcion: Veinte
    definicion: Veinte (20) unidades de un artículo de abastecimiento.
    atributos:
      marca_asterisco: false
  - codigo: AY
    descripcion: Conjunto (assembly)
    definicion: Combinación de piezas montadas para formar una unidad completa, constituyendo un único artículo de abastecimiento,
      por ej., conjunto manguera. Debe usarse sólo cuando el término "conjunto" forma parte del nombre del artículo.
    atributos:
      marca_asterisco: false
  - codigo: BA
    descripcion: Ovillo
    definicion: Cuerpo esférico de materiales como cordel o hilo.
    atributos:
      marca_asterisco: true
  - codigo: BB
    descripcion: Bobina
    definicion: Cilindro de hilo, cordel, cable, arrollado en torno a un soporte.
    atributos:
      marca_asterisco: true
  - codigo: BC
    descripcion: Bloque
    definicion: Una pieza de material como madera, piedra, o metal, normalmente con una o más caras planas.
    atributos:
      marca_asterisco: true
  - codigo: BD
    descripcion: Atado
    definicion: Conjunto del mismo artículo atado junto sin presión.
    atributos:
      marca_asterisco: true
  - codigo: BE
    descripcion: Bala/fardo
    definicion: Fardo (atado con cuerdas o cables metálicos) apretado de mercaderías y normalmente envuelto en tela o papel.
    atributos:
      marca_asterisco: true
  - codigo: BF
    descripcion: Pie tablar
    definicion: Unidad de medida para madera que equivale al volumen de un tablero de medidas 12" x 12" x 1". 2,3597 decímetros
      cúbicos
    atributos:
      marca_asterisco: false
  - codigo: BG
    descripcion: Bolsa
    definicion: Recipiente flexible de diversos tamaños y formas, fabricado de materiales plásticos, textiles o papel. Incluye
      "saco".
    atributos:
      marca_asterisco: true
  - codigo: BK
    descripcion: Libro
    definicion: Paquete con forma de libro, como etiquetas o billetes, sujetos juntos sobre un borde, y normalmente con cubiertas
      protectoras.
    atributos:
      marca_asterisco: true
  - codigo: BL
    descripcion: Barril
    definicion: Recipiente cilíndrico, de metal o madera, con los extremos planos o de igual diámetro y laterales que sobresalen.
      Excluye barrica (barril pequeño).
    atributos:
      marca_asterisco: true
  - codigo: BO
    descripcion: Pieza (tela)
    definicion: Una pieza de tela doblada sobre un soporte de cartón rígido plano.
    atributos:
      marca_asterisco: true
  - codigo: BR
    descripcion: Varilla
    definicion: Pieza de metal u otra materia, mucho más larga que gruesa. No es aplicable a artículos como jabón, cera de
      abeja o compuestos pulimentadotes.
    atributos:
      marca_asterisco: true
  - codigo: BT
    descripcion: Botella
    definicion: Vasija de vidrio, plástico o barro cocido de diversos tamaños, formas y terminaciones, excluyendo jarras,
      ampollas, viales, garrafas, con un cierre para retener el contenido.
    atributos:
      marca_asterisco: true
  - codigo: BX
    descripcion: Caja
    definicion: Recipiente rígido tridimensional de diversos tamaños y materiales. Incluye "maleta", "jaula", "cajón".
    atributos:
      marca_asterisco: true
  - codigo: CA
    descripcion: Cartucho
    definicion: Recipiente normalmente cilíndrico para materiales flexibles o sueltos diseñado para máquinas dispensadoras.
      Normalmente va asociados a productos adhesivos o sellantes.
    atributos:
      marca_asterisco: true
  - codigo: CB
    descripcion: Garrafa
    definicion: Recipiente robusto, similar a una botella, usada para el transporte y almacenamiento de líquidos. Normalmente
      está diseñada para encajarse en contenedores de protección para su envío.
    atributos:
      marca_asterisco: true
  - codigo: CC
    descripcion: Centímetro cúbico
    definicion: Millonésima parte (1/1,000,000) de un metro cúbico en el sistema métrico Unidad de medida de volumen.
    atributos:
      marca_asterisco: false
  - codigo: CD
    descripcion: Yarda cúbica
    definicion: Unidad de medida de volumen. 764,5 decímetros cúbicos
    atributos:
      marca_asterisco: false
  - codigo: CE
    descripcion: Cono
    definicion: Material enrollado sobre sí mismo con forma de cono, como por ej. hilo o cordel enrollado sobre un núcleo
      cónico.
    atributos:
      marca_asterisco: true
  - codigo: CF
    descripcion: Pie cúbico
    definicion: Unidad de medida de volumen. 28,32 decímetros cúbicos
    atributos:
      marca_asterisco: false
  - codigo: CG
    descripcion: Centigramo
    definicion: Centésima parte (1/100) de un gramo en el sistema métrico.
    atributos:
      marca_asterisco: false
  - codigo: CI
    descripcion: Pulgada cúbica
    definicion: Unidad de medida de volumen. 0,0163 decímetros cúbicos
    atributos:
      marca_asterisco: false
  - codigo: CK
    descripcion: Pastilla
    definicion: Bloque de material compacto o congelado. Aplicable a artículos como jabón o compuestos abrillantadores.
    atributos:
      marca_asterisco: true
  - codigo: CL
    descripcion: Arrollamiento
    definicion: Rollo de materiales como alambre, cuerdo, tubería, enrollados en forma circular.
    atributos:
      marca_asterisco: true
  - codigo: CM
    descripcion: Centímetro
    definicion: Centésima parte (1/100) de un metro en el sistema métrico.
    atributos:
      marca_asterisco: false
  - codigo: CN
    descripcion: Bote
    definicion: Recipiente rígido de fibra, metal, plástico, o una combinación de éstos. Pueden tener forma cilíndrica u otras
      irregulares. Su uso se restringe a aquellos artículos que no se pueden suministrar en cantidades inferiores al contenido
      del recipiente. No debe
    atributos:
      marca_asterisco: true
  - codigo: CO
    descripcion: Contenedor
    definicion: Término genérico para usar cuando un mismo artículo con un único NOC pueda ser embalado para suministro en
      contenedores opcionales, como por ej. botella o tubo.
    atributos:
      marca_asterisco: true
  - codigo: CP
    descripcion: Cápsula
    definicion: Recipiente metálico o de plástico para líquidos.
    atributos:
      marca_asterisco: true
  - codigo: CS
    descripcion: Estuche/caja
    definicion: Recipiente para guardar ordenadamente uno o varios objetos determinados, mediante sujeciones o alojamientos
      específicos.
    atributos:
      marca_asterisco: true
  - codigo: CT
    descripcion: Caja cartón
    definicion: Contenedor, generalmente de cartón o fibra de papel, con tapas fijas o plegables.
    atributos:
      marca_asterisco: true
  - codigo: CV
    descripcion: Decímetro cúbico
    definicion: Milésima parte (1/1,000) de un metro cúbico en el sistema métrico.
    atributos:
      marca_asterisco: false
  - codigo: CY
    descripcion: Bombona
    definicion: Recipiente portátil metálico rígido, cilíndrico para almacenamiento y transporte de gases comprimidos, generalmente
      equipados con válvulas de cierre y de seguridad.
    atributos:
      marca_asterisco: true
  - codigo: CZ
    descripcion: Metro cúbico
    definicion: Unidad de volumen del sistema métrico. Su utilización está limitada a NOC's de asignación local utilizados
      para la compra local de artículos como cemento ya preparado y asfalto en zonas donde su utiliza el sistema métrico.
    atributos:
      marca_asterisco: false
  - codigo: DA
    descripcion: Decámetro
    definicion: Diez (10) metros.
    atributos:
      marca_asterisco: false
  - codigo: DB
    descripcion: Decalitro
    definicion: Diez (10) litros.
    atributos:
      marca_asterisco: false
  - codigo: DC
