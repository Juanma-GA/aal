[project]
name = "aal-backend"
# The app's version: GET /api/version answers it (app/version.py reads it
# from here) and tests/unit/test_version.py checks it equals package.json's.
version = "0.1.0"
description = "AAL (Análisis de Apoyo Logístico) backend: FastAPI + SQLAlchemy 2 async + Alembic + PostgreSQL 16."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # tests/_testdb.py and the scripts read backend/.env with it (also a
    # dependency of pydantic-settings, listed because we import it).
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # ASGITransport: the tests' HTTP client against the real app.
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
