# Every push and PR: secret scan, then npm run check:all on Postgres 16, then
# the browser check against the real backend and Vite.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The binary is checked before it runs (AACF G3): its SHA-256 must be
      # the one pinned here AND the one the release's checksums file lists.
      # Any mismatch stops the job. To upgrade: change both values together,
      # taking the hash from gitleaks_<version>_checksums.txt of the release.
      - name: gitleaks (checksum verified)
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          published=$(awk -v f="$archive" '$2 == f { print $1 }' checksums.txt)
          actual=$(sha256sum "$archive" | awk '{ print $1 }')
          echo "pinned:    $GITLEAKS_SHA256"
          echo "published: $published"
          echo "actual:    $actual"
          if [ -z "$published" ] || [ "$published" != "$GITLEAKS_SHA256" ] || [ "$actual" != "$GITLEAKS_SHA256" ]; then
            echo "::error::gitleaks checksum mismatch: not running it"
            exit 1
          fi
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  # Windows is the development machine (D17): the backend must start there
  # (E16: no zone database of its own, the tzdata package) and its unit tests
  # pass. No database: the app is only imported and the unit tests never
  # touch one (the URLs below are never reached).
  windows:
    runs-on: windows-latest
    env:
      DATABASE_URL: postgresql+asyncpg://aal:aal@localhost:5432/aal
      TEST_DATABASE_URL: postgresql+asyncpg://aal:aal@localhost:5432/aal_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Backend virtualenv (hashed lockfile)
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install --require-hashes -r requirements-dev.lock.txt
      - name: The backend starts (import of app.main)
        run: |
          .venv\Scripts\python.exe scripts\generate_rsa_keypair.py
          .venv\Scripts\python.exe -c "import app.main; print('app.main OK')"
      - name: Unit tests
        run: .venv\Scripts\python.exe -m pytest -q tests/unit

  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aal
          POSTGRES_PASSWORD: aal
          POSTGRES_DB: aal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # The newest 24.x, never an older cached one under engines.node.
          check-latest: true
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Backend virtualenv (hashed lockfile)
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install --require-hashes -r requirements-dev.lock.txt
      - name: Frontend dependencies (exact lockfile)
        run: npm ci
      - name: JWT keys, app database and test database
        working-directory: backend
        run: |
          .venv/bin/python scripts/generate_rsa_keypair.py
          .venv/bin/python -m alembic upgrade head
          cd .. && npm run test:db:create
      # Throw-away passwords for this job's own database, generated here and
      # masked in the log: no credential is written in this file (D17).
      - name: Admin and development data
        working-directory: backend
        run: |
          for name in VERIFY_ADMIN_PASSWORD DEV_ANALISTA_PASSWORD DEV_REVISOR_PASSWORD DEV_OBSERVADOR_PASSWORD; do
            value="Ci-$(openssl rand -hex 16)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
            export "$name=$value"
          done
          echo "VERIFY_ADMIN_EMAIL=admin@aal-ci.es" >> "$GITHUB_ENV"
          INITIAL_ADMIN_PASSWORD="$VERIFY_ADMIN_PASSWORD" .venv/bin/python scripts/create_admin_user.py admin@aal-ci.es
          .venv/bin/python scripts/seed_dev_data.py
      - name: npm run check:all
        run: npm run check:all
      - name: verify-health, verify-auth-settings, verify-navigation, verify-reference-tables, verify-conf-fun, verify-materials, verify-articles, verify-articles-perf, verify-confunfis and verify-validation (real Chromium, backend and Vite)
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          SHOTS_DIR: ${{ runner.temp }}/shots
        run: |
          mkdir -p "$SHOTS_DIR"
          (cd backend && .venv/bin/uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/uvicorn.log" 2>&1 &)
          (npx vite --port 5173 --strictPort > "$RUNNER_TEMP/vite.log" 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173/api/version > /dev/null && break
            sleep 1
          done
          node scripts/verify-health.mjs
          node scripts/verify-auth-settings.mjs
          node scripts/verify-navigation.mjs
          node scripts/verify-reference-tables.mjs
          node scripts/verify-conf-fun.mjs
          # verify-materials needs the demo catalog and materials (E11).
          node scripts/import-demo-catalog.mjs
          (cd backend && .venv/bin/python scripts/seed_demo_materials.py)
          node scripts/verify-materials.mjs
          node scripts/verify-articles.mjs
          # E13: 2000 synthetic articles, typing < 100 ms and applying to 200 rows < 1 s.
          node scripts/verify-articles-perf.mjs
          # verify-confunfis needs the demo articles and CONFUNFIS (E13), after
          # verify-materials (which removes 0102 when no CONFUNFIS uses it).
          (cd backend && .venv/bin/python scripts/seed_demo_articles.py && .venv/bin/python scripts/seed_demo_confunfis.py)
          node scripts/verify-confunfis.mjs
          # verify-validation (E16): the same demo, left as it was by verify-confunfis.
          node scripts/verify-validation.mjs
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
